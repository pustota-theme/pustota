[flake8]
format = wemake
show-source = true
doctests = true
statistics = false

# darglint configuration:
# https://github.com/terrencepreilly/darglint
strictness = long
docstring-style = numpy

# Plugins:
max-complexity = 6
max-line-length = 80

exclude =
  # Trash and cache:
  .git
  __pycache__
  .venv

ignore = D100, D104, D401, W504, RST303, RST304, DAR103, DAR203

per-file-ignores =
  # Disable pydocstyle checks for `parser` grammar:
  dotenv_linter/grammar/parser.py: D205, D400, D403, WPS214

[mypy]
# The mypy configurations: http://bit.ly/2zEl9WI
enable_error_code =
  truthy-bool,
  truthy-iterable,
  redundant-expr,
  unused-awaitable,
  # ignore-without-code,
  possibly-undefined,
  redundant-self,

disallow_any_explicit = false
ignore_missing_imports = true
strict = true
warn_unreachable = true

[mypy-dotenv_linter.grammar.parsetab]
ignore_errors = true

; ---------------------------------------------------------------------------
; Syntax showcase: delimiters, comments, quoting, interpolation, continuations
; ---------------------------------------------------------------------------

[isort]
# Three delimiter styles: `=`, ` = `, and `:`
profile=wemake
line_length = 80
multi_line_output: 3
include_trailing_comma = True
known_first_party: dotenv_linter
default_section = THIRDPARTY
skip_glob = **/migrations/*.py, **/node_modules/**
; an inline comment after the value
force_grid_wrap = 0  ; comment
use_parentheses = true # also a comment

[tool:pytest]
# Keys with dots, dashes, and spaces
python_files = test_*.py *_test.py
python-classes = Test* Check*
python classes alias = Test*
norecursedirs = *.egg .eggs dist build docs .tox .git __pycache__
addopts =
  --strict-markers
  --strict-config
  --tb=short
  --cov=dotenv_linter
  --cov-report=term-missing:skip-covered
  --cov-report=html
  --cov-fail-under=100
timeout = 30
filterwarnings =
  error
  ignore::DeprecationWarning:pkg_resources.*
  ignore:.*unclosed.*:ResourceWarning
markers =
  slow: marks tests as slow (deselect with '-m "not slow"')
  integration: integration tests that need network

[paths]
# Values of many shapes
home = /home/sobolev
windows = C:\Users\sobolev\Desktop\pustota
relative = ../src/palettes
url = https://github.com/pustota-theme/pustota.git
url_with_query = https://example.com/search?q=pustota&lang=en
email = n.a.sobolev@gmail.com
with_equals = a=b=c
with_colon = host:8080
with_semicolon = "value; not a comment"
quoted_double = "pustota theme"
quoted_single = 'single quoted value'
quoted_with_escapes = "line one\nline two\t\"quoted\""
empty_value =
empty_value_colon:
another_empty_key
unicode = пустота — 空
spaces_inside = value with   many   spaces
percent = 100%
pattern = [a-z]+\.(py|pyi)$
glob = src/**/*.{js,ts}

[types]
int = 42
negative = -17
float = 3.14
exponent = 1e-5
hex = 0x1A
bool_true = true
bool_yes = yes
bool_on = on
bool_1 = 1
bool_false = false
bool_no = no
bool_off = off
null_like = None
list_csv = alpha, beta, gamma
list_multiline =
  alpha
  beta
  gamma

[interpolation]
# configparser `%(name)s` style and ExtendedInterpolation `${section:key}` style
root = /opt/pustota
logs = %(root)s/logs
cache = %(root)s/cache/%(user)s
user = sobolev
data_dir = ${root}/data
palette = ${paths:relative}/dark.json
home_dir = ${HOME}/.config/pustota
literal_percent = 100%%
env_style = $HOME/.local/share

[DEFAULT]
# Defaults inherited by every section
timeout = 10
retries = 3
verbose = false

[server]
timeout = 60
retries = 5

[client]
timeout = 5
host = localhost
port = 8080

[logging]
level = INFO
format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt = %Y-%m-%d %H:%M:%S

[logger_root]
level = NOTSET
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stdout,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

[core]
# Git-config style sections and keys
repositoryformatversion = 0
filemode = true
bare = false
logallrefupdates = true
ignorecase = true
precomposeunicode = true

[remote "origin"]
url = git@github.com:pustota-theme/pustota.git
fetch = +refs/heads/*:refs/remotes/origin/*

[branch "master"]
remote = origin
merge = refs/heads/master

[alias]
lg = log --graph --pretty=format:'%C(yellow)%h%Creset -%C(red)%d%Creset %s %C(green)(%cr)%Creset' --abbrev-commit
st = status -sb
unstage = reset HEAD --

[includeIf "gitdir:~/work/"]
path = ~/.gitconfig-work

[section.with.dots]
key = value

[section-with-dashes]
key = value

[ section with spaces ]
key = value
